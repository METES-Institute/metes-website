# Decap CMS 설정 — landing.html의 content/landing.json을 편집하는 화면을 정의합니다.
# 실제로 로그인이 되려면 GitHub OAuth App + OAuth 중개 서버가 먼저 준비돼 있어야 합니다.
# (README.md의 "랜딩페이지 콘텐츠 관리(Decap CMS)" 항목 참고)

backend:
  name: github
  repo: METES-Institute/metes-website
  branch: main
  # 로그인은 Netlify가 무료로 대신 처리해줌 (아래 참고) — 별도 서버/OAuth App을
  # 직접 만들 필요 없음. README.md 4부의 3단계 안내를 따라 하면 됨.

# 시트처럼 별도 이미지 저장소를 쓰지 않고, 기존 방식대로 구글 드라이브 공유 링크를
# 텍스트로 붙여넣는 방식을 그대로 씁니다 (media_folder 미사용).

publish_mode: simple
locale: 'ko'

collections:
  - name: landing
    label: '랜딩페이지'
    files:
      - file: content/landing.json
        label: 'METES 랜딩페이지 전체 콘텐츠'
        name: landing
        fields:
          - label: 'Hero'
            name: hero
            widget: object
            fields:
              - { label: '상단 배지 문구', name: badge, widget: string }
              - { label: '로고 아래 소개 태그', name: tag, widget: string }
              - { label: '리드 문장 (줄바꿈은 그대로 Enter)', name: lede, widget: text }
              - { label: '버튼1 라벨 (Interest Form)', name: cta1_label, widget: string }
              - { label: '버튼1 링크', name: cta1_url, widget: string }
              - { label: '버튼2 라벨 (Mailing List)', name: cta2_label, widget: string }
              - { label: '버튼2 링크', name: cta2_url, widget: string }
              - label: '배경 롤링 사진'
                name: slides
                widget: list
                fields:
                  - { label: '구글 드라이브 공유 링크(또는 이미지 URL)', name: img, widget: string }
                  - { label: '캡션', name: caption, widget: string }

          - label: 'About'
            name: about
            widget: object
            fields:
              - { label: '섹션 라벨', name: eyebrow, widget: string }
              - { label: '헤드라인 ({{h}}강조{{/h}}로 감싼 부분이 오렌지색)', name: statement, widget: text }
              - { label: '설명 문단 1', name: desc1, widget: text }
              - { label: '설명 문단 2', name: desc2, widget: text }
              - label: '하단 통계'
                name: stats
                widget: list
                fields:
                  - { label: '숫자', name: number, widget: string }
                  - { label: '설명', name: label, widget: string }
                  - { label: '참고 메모 (예: 수치 확인 필요, 없으면 비워둠)', name: note, widget: string, required: false }

          - label: 'Program (Roadmap)'
            name: roadmap
            widget: object
            fields:
              - { label: '섹션 라벨', name: eyebrow, widget: string }
              - { label: '제목 ({{h}}강조{{/h}})', name: title, widget: string }
              - { label: '리드 문장', name: lead, widget: text }
              - { label: '왼쪽 배지 (모집 상태)', name: badge_status, widget: string }
              - { label: '오른쪽 배지 (기간)', name: badge_duration, widget: string }
              - label: 'Learning Block 4개'
                name: blocks
                widget: list
                fields:
                  - { label: '블록 번호 (예: LB 01)', name: key, widget: string }
                  - { label: '시작월 (예: Mar)', name: start_month, widget: string }
                  - { label: '종료월 (예: May)', name: end_month, widget: string }
                  - { label: '제목', name: title, widget: string }
                  - { label: '설명', name: desc, widget: string }

          - label: 'Sessions'
            name: sessions
            widget: object
            fields:
              - { label: '섹션 라벨', name: eyebrow, widget: string }
              - { label: '제목 ({{h}}강조{{/h}})', name: title, widget: string }
              - label: '세션 카드 (화요일 / 금요일 순서 고정)'
                name: cards
                widget: list
                fields:
                  - { label: '요일 라벨 (예: Every Tuesday)', name: day, widget: string }
                  - { label: '제목', name: title, widget: text }
                  - { label: '설명', name: desc, widget: text }
                  - label: '태그 목록'
                    name: tags
                    widget: list
                    field: { label: '태그', name: tag, widget: string }
                  - { label: '누적 숫자', name: stat_number, widget: string }
                  - { label: '누적 숫자 설명', name: stat_caption, widget: string }
                  - { label: '참고 메모', name: note, widget: string, required: false }

          - label: 'What We Offer'
            name: offer
            widget: object
            fields:
              - { label: '섹션 라벨', name: eyebrow, widget: string }
              - label: '카드 4개 (순서 고정)'
                name: items
                widget: list
                fields:
                  - { label: '아이콘', name: icon, widget: select, options: [mentoring, open, project, network] }
                  - { label: '제목', name: title, widget: string }
                  - { label: '설명', name: desc, widget: text }

          - label: 'Members'
            name: members
            widget: object
            fields:
              - { label: '섹션 라벨', name: eyebrow, widget: string }
              - { label: '제목 ({{h}}강조{{/h}})', name: title, widget: string }
              - { label: '설명', name: desc, widget: text }
              - { label: '하단 안내 문구', name: note, widget: string }
              - label: '마이스터 이름 목록 (한 줄에 이름 하나)'
                name: meisters
                widget: list
                field: { label: '이름', name: name, widget: string }
              - label: '메이커 목록'
                name: makers
                widget: list
                fields:
                  - { label: '이름', name: name, widget: string }
                  - { label: '참여 기수 (예: 3·4)', name: cohorts, widget: string, required: false }
              - label: '모더레이터 이름 목록'
                name: moderators
                widget: list
                field: { label: '이름', name: name, widget: string }

          - label: 'Cohort CTA (맨 아래)'
            name: cta
            widget: object
            fields:
              - { label: '배지', name: badge, widget: string }
              - { label: '제목', name: title, widget: string }
              - { label: '설명', name: desc, widget: text }

          - label: 'Footer'
            name: footer
            widget: object
            fields:
              - { label: '소개 문구', name: desc, widget: text }
              - { label: '이메일', name: email, widget: string }
              - { label: 'Instagram 링크', name: instagram_url, widget: string }
              - { label: '뉴스레터 링크', name: newsletter_url, widget: string }
              - { label: '주소', name: address, widget: text }
              - { label: '저작권 문구', name: copyright, widget: string }
              - { label: '후원 문구', name: poweredby, widget: string }
